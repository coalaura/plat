name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  project_name: plat

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - name: Build Frontend
      run: |
        cd static
        bun install
        bun run build
        cd ..
        mv static/dist public

    - name: Build
      id: build
      uses: coalaura/build@v1
      with:
        os: ${{ matrix.goos }}
        arch: ${{ matrix.goarch }}
        generate: false
        output: bin/${{ env.project_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        go-flags: |
          -trimpath
          -buildvcs=false
          -ldflags=-s -w -X main.Version=${{ github.ref_name }}

    - name: Sign
      id: sign
      uses: coalaura/sign@v1
      with:
        path: ${{ steps.build.outputs.path }}
        key: ${{ secrets.COALAURA_PFX }}
        passphrase: ${{ secrets.COALAURA_PFX_PASSWORD }}
        chain: |
          https://wiese2.org/pki/issuing.pem
          https://wiese2.org/pki/root.pem

    - name: Package Archive
      shell: bash
      env:
        SIGNED_BINARY: ${{ steps.sign.outputs.path }}
      run: |
        cp -r public bin/public
        cd bin
        BINARY="$(basename "$SIGNED_BINARY")"
        if [[ "${{ matrix.goos }}" == "windows" ]]; then
          zip -r "${{ env.project_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "$BINARY" public
        else
          tar czf "${{ env.project_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "$BINARY" public
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.project_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
        path: |
          bin/*.tar.gz
          bin/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ env.project_name }}_*
        path: bin
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: bin/*
        name: "Release ${{ github.ref_name }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
